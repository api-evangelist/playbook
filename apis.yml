description: Playbook is a career-growth platform for women that combines expert-led
  Masterclasses with an engaged professional community, enabling members to keep learning,
  build skills, and advance into leadership roles. Its tagline "Connect, Learn, Invest"
  reflects a focus on peer connection, ongoing education, and investing in one's own
  career. Playbook is backed by 500 Global and Bain Capital Ventures. As of this profile
  the company operates a consumer marketing and community web experience and does not
  publish a public developer API, SDKs, or developer documentation.
